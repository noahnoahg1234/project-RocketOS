set timeout=4
set default=0
set color_normal=light-gray/black
set color_highlight=black/light-red
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "RocketOS" {
    linux /casper/vmlinuz boot=casper quiet splash noprompt fsck.mode=skip ---
    initrd /casper/initrd
}
menuentry "RocketOS (save my files to a 'casper-rw' partition)" {
    linux /casper/vmlinuz boot=casper persistent quiet noprompt fsck.mode=skip ---
    initrd /casper/initrd
}
menuentry "RocketOS (safe graphics)" {
    linux /casper/vmlinuz boot=casper nomodeset noprompt fsck.mode=skip ---
    initrd /casper/initrd
}
menuentry "RocketOS (text console only)" {
    linux /casper/vmlinuz boot=casper noprompt fsck.mode=skip systemd.unit=multi-user.target rocketos.text ---
    initrd /casper/initrd
}
